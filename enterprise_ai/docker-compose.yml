services:
  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: eai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-sunbo.0208}
      MYSQL_DATABASE: enterprise_ai
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"          # 宿主 3307，避免与本机 MySQL 冲突
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-sunbo.0208}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- FastAPI 后端 ----------
  backend:
    build: ./backend
    container_name: eai-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql                      # 容器网络内主机名
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-sunbo.0208}
      DB_NAME: enterprise_ai
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      LOG_LEVEL: INFO
    ports:
      - "8003:8003"
    volumes:
      - uploads_data:/app/uploads_docs    # 文档与向量库持久化（chroma_store 同级）
      - logs_data:/app/logs
      - chroma_data:/app/chroma_store
      # 生产可选：把前端 dist 构建产物挂进来即可由后端同域托管
      # - ./frontend/dist:/app/static_dist:ro

volumes:
  mysql_data:
  uploads_data:
  logs_data:
  chroma_data:
