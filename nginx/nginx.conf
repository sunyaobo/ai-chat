# ============================================================
#  Nginx 反向代理：按路径前缀分发到 4 个后端 + HTTPS
# ============================================================

client_max_body_size 30m;

upstream chat_app       { server chat-app:8000; }
upstream qa_bot         { server qa-bot:8001; }
upstream code_review    { server code-review-bot:8002; }
upstream enterprise_ai  { server enterprise-ai:8003; }

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl;
    server_name _;

    # 自签名证书（部署时在服务器上生成：openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout ssl/server.key -out ssl/server.crt -subj "/CN=39.96.63.42"）
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- 健康检查 ----
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ---- 1) chat_app ----
    location /chat/ {
        proxy_pass http://chat_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- 2) qa_bot ----
    location /qa/ {
        proxy_pass http://qa_bot/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # ---- 3) code_review ----
    location /review/ {
        proxy_pass http://code_review/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # ---- 4) enterprise_ai ----
    location /enterprise/ {
        proxy_pass http://enterprise_ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
