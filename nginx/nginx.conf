# ============================================================
#  Nginx 反向代理：按路径前缀分发到 4 个后端
#  前端 Vercel 各项目 API 基址：
#    chat_app       → http://服务器IP/chat
#    qa_bot         → http://服务器IP/qa
#    code_review    → http://服务器IP/review
#    enterprise_ai  → http://服务器IP/enterprise
# ============================================================

# 文件上传大小限制（组件文档 / 截图）
client_max_body_size 30m;

upstream chat_app       { server chat-app:8000; }
upstream qa_bot         { server qa-bot:8001; }
upstream code_review    { server code-review-bot:8002; }
upstream enterprise_ai  { server enterprise-ai:8003; }

server {
    listen 80;
    server_name _;

    # ---- 健康检查 ----
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ---- 1) chat_app  http://IP/chat/api/... ----
    location /chat/ {
        proxy_pass http://chat_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- 2) qa_bot  http://IP/qa/api/... ----
    location /qa/ {
        proxy_pass http://qa_bot/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # ---- 3) code_review  http://IP/review/api/... ----
    location /review/ {
        proxy_pass http://code_review/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # ---- 4) enterprise_ai  http://IP/enterprise/api/... ----
    location /enterprise/ {
        proxy_pass http://enterprise_ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
